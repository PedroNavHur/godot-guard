[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-guard"
version = "0.4.0"
description = "Lint, format, analyzer, complexity, and ratchet-baseline guardrails for Godot 4 projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["gdtoolkit>=4.5,<5"]

[project.scripts]
godot-guard = "godot_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
godot_guard = ["data/*.gd", "templates/*"]
