name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install godot-guard
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/PedroNavHur/godot-guard/releases/download/v{version}/godot-guard-x86_64-unknown-linux-gnu.tar.gz" \
            | tar --extract --gzip --directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: {godot_version}
          use-dotnet: false
          include-templates: false

      - name: Gate
        timeout-minutes: 15
        run: godot-guard gate
