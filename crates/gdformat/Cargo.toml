[package]
name = "gdformat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gdscript = { path = "../gdscript" }
pycompat = { path = "../pycompat" }

[dev-dependencies]
# The parity tests also format gdtoolkit's own trees, read through gdscript's oracle loader.
gdscript = { path = "../gdscript", features = ["oracle"] }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
