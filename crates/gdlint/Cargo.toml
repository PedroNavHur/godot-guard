[package]
name = "gdlint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Read trees from tools/oracle/dump_tree.py dumps; the binary needs it until gdscript::parse exists.
oracle = ["gdscript/oracle"]

[[bin]]
name = "gdlint"
required-features = ["oracle"]

[dependencies]
gdscript = { path = "../gdscript" }
regex = "1"
saphyr-parser = "0.2"

[dev-dependencies]
gdscript = { path = "../gdscript", features = ["oracle"] }
serde_json = "1"
