name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml, so the runner builds with the pinned toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p godot-guard
      # The binary runs gdformat and gdlint in-process, so it ships alone.
      - name: Package
        run: tar --create --gzip --file "godot-guard-${{ matrix.target }}.tar.gz" --directory target/release godot-guard
      - uses: actions/upload-artifact@v4
        with:
          name: godot-guard-${{ matrix.target }}
          path: godot-guard-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz --clobber
